version: '3.8'

services:
  redis-broker:
    image: redis:7-alpine
    container_name: auraguard_redis
    ports:
      - "6379:6379"
    restart: always

  api-gateway:
    build: .
    container_name: auraguard_api
    command: uvicorn src.main_api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - redis-broker

  clinical-ui:
    build: .
    container_name: auraguard_ui
    command: streamlit run src/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - redis-broker
